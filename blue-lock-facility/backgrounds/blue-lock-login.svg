<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00030A"/>
      <stop offset="0.5" stop-color="#010A1E"/>
      <stop offset="1" stop-color="#0A1E3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.52" r="0.58">
      <stop offset="0" stop-color="#0066FF" stop-opacity="0.26"/>
      <stop offset="0.4" stop-color="#00E5FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#010A1E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hexGrid2" width="120" height="104" patternUnits="userSpaceOnUse">
      <path d="M60 0 L116 32 L116 72 L60 104 L4 72 L4 32 Z" fill="none" stroke="#0066FF" stroke-opacity="0.06" stroke-width="1.1"/>
    </pattern>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <rect width="3840" height="2160" fill="url(#hexGrid2)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>

  <!-- Grid sutil -->
  <g opacity="0.06">
    <path d="M0 270 H3840 M0 540 H3840 M0 810 H3840 M0 1080 H3840 M0 1350 H3840 M0 1620 H3840 M0 1890 H3840" stroke="#00E5FF" stroke-width="1"/>
    <path d="M360 0 V2160 M720 0 V2160 M1080 0 V2160 M1440 0 V2160 M1800 0 V2160 M2160 0 V2160 M2520 0 V2160 M2880 0 V2160 M3240 0 V2160" stroke="#0066FF" stroke-width="0.6"/>
  </g>

  <!-- Portal direita — mais sutil pro login -->
