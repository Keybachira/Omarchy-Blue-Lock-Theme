    <circle cx="170" cy="196" r="96" fill="none" stroke="#00E5FF" stroke-width="2.2" stroke-opacity="0.32"/>
    <circle cx="170" cy="196" r="132" fill="none" stroke="#0066FF" stroke-width="1" stroke-opacity="0.12"/>
    <circle cx="170" cy="180" r="42" fill="#00E5FF" fill-opacity="0.09" stroke="#00E5FF" stroke-width="1.8" stroke-opacity="0.5"/>
    <!-- olho pequeno -->
    <ellipse cx="170" cy="182" rx="16" ry="24" fill="#00E5FF" fill-opacity="0.88"/>
    <ellipse cx="170" cy="182" rx="7" ry="12" fill="#010A1E"/>
  </g>

  <!-- Texto esquerda — área do login -->
  <g transform="translate(220 340)">
    <text x="0" y="0" fill="none" stroke="#0066FF" stroke-width="2.2" stroke-opacity="0.38" font-family="Space Grotesk, sans-serif" font-size="96" font-weight="900" letter-spacing="14">BLUE LOCK</text>
    <text x="0" y="0" fill="#E6F0FF" font-family="Space Grotesk, sans-serif" font-size="96" font-weight="900" letter-spacing="14">BLUE LOCK</text>
    <rect x="0" y="28" width="520" height="3" rx="1.5" fill="#0066FF" fill-opacity="0.85"/>
    <rect x="0" y="28" width="300" height="3" rx="1.5" fill="#00E5FF"/>
    <text x="0" y="72" fill="#00E5FF" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" letter-spacing="10">FACILITY FIVE</text>
    <text x="0" y="104" fill="#7AA0C8" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="5">AUTHENTICATION  NODE  —  EGO  REQUIRED</text>
    <!-- flor -->
