        <ellipse cx="19" cy="-6.2" rx="10" ry="20" transform="rotate(72 19 -6.2)"/>
        <ellipse cx="11.8" cy="16.2" rx="10" ry="20" transform="rotate(144 11.8 16.2)"/>
        <ellipse cx="-11.8" cy="16.2" rx="10" ry="20" transform="rotate(216 -11.8 16.2)"/>
        <ellipse cx="-19" cy="-6.2" rx="10" ry="20" transform="rotate(288 -19 -6.2)"/>
      </g>
